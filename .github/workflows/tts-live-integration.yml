name: Tencent and Volcengine TTS Integration (automatic, paid)

on:
  push:
    paths:
      - "tts/providers/tencent/**"
      - "tts/providers/volcengine/**"
      - "speech_tts.go"
      - "audio/**"
      - "speecherr/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/tts-live-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tencent-live-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TENCENT_APP_ID: ${{ vars.TENCENT_APP_ID }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_TTS_VOICE: ${{ vars.TENCENT_TTS_VOICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Tencent credentials
        run: |
          test -n "$TENCENT_APP_ID" || { echo "Missing TENCENT_APP_ID repository variable" >&2; exit 1; }
          test -n "$TENCENT_SECRET_ID" || { echo "Missing TENCENT_SECRET_ID repository secret" >&2; exit 1; }
          test -n "$TENCENT_SECRET_KEY" || { echo "Missing TENCENT_SECRET_KEY repository secret" >&2; exit 1; }
      - name: Real signed Tencent TTS WSv2 PCM synthesis and final EOF
        shell: bash
        run: |
          set -euo pipefail
          if go test -tags=integration -run '^TestTencentLive(TTS|Duplex)$' -count=1 -v -timeout 90s ./tts/providers/tencent > "$RUNNER_TEMP/tencent-tts-live.log" 2>&1; then
            cat "$RUNNER_TEMP/tencent-tts-live.log"
            echo "### Tencent TTS: PASS — real PCM audio and EOF verified" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/tencent-tts-live.log"
            # Resource-pack exhaustion is an account-level billing blocker.
            # Keep other genuine protocol or API failures gating.
            if grep -q 'Tencent TTS error 3022: The resource pack allowance has been exhausted' "$RUNNER_TEMP/tencent-tts-live.log"; then
              echo "::warning title=Tencent TTS live verification blocked by billing::Cloud error 3022: resource pack exhausted. PCM audio NOT verified. Enable postpaid billing or renew quota."
              echo "### Tencent TTS: NOT VALIDATED — account resource pack exhausted (3022)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Tencent TTS: FAIL — cloud API or protocol error" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

  volcengine-live-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      VOLCENGINE_TTS_MODEL_ID: ${{ vars.VOLCENGINE_TTS_MODEL_ID }}
      VOLCENGINE_TTS_VOICE: ${{ vars.VOLCENGINE_TTS_VOICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Volcengine API key
        run: |
          test -n "$VOLCENGINE_API_KEY" || { echo "Missing VOLCENGINE_API_KEY repository secret" >&2; exit 1; }
          test -n "$VOLCENGINE_TTS_VOICE" || { echo "Set VOLCENGINE_TTS_VOICE to an authorized Seed-TTS 3.0 voice" >&2; exit 1; }
      - name: Real Seed-TTS 3.0 HTTP and WebSocket synthesis
        run: go test -tags=integration -run TestVolcengineLive -count=1 -v -timeout 3m ./tts/providers/volcengine
