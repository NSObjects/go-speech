name: Temporary ASR format

on:
  push:
    branches: [feat/asr-short-audio-recognize]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          gofmt -w asr/recognize.go asr/recognize_test.go asr/asr.go speech.go asr/providers/aliyun/recognize.go asr/providers/volcengine/recognize.go asr/providers/tencent/recognize.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add asr/recognize.go asr/recognize_test.go asr/asr.go speech.go asr/providers/aliyun/recognize.go asr/providers/volcengine/recognize.go asr/providers/tencent/recognize.go
            git commit -m "style(asr): gofmt short-audio implementation"
            git push origin HEAD:feat/asr-short-audio-recognize
          fi
