name: Volcengine ASR Natural Mandarin Canary (automatic, paid)

# Diagnostic experiment for issue #45: establish whether real Mandarin
# speech works before changing the existing strict multi-turn fixtures.
on:
  push:
    paths:
      - "asr/providers/volcengine/**"
      - ".github/workflows/volcengine-natural-mandarin-canary.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  live-mandarin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ghcr.io/nsobjects/go-speech-ci:sha-97c09deafd7c79bcf75e85e9bd3147d7f0299f87
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      VOLCENGINE_RESOURCE_ID: ${{ vars.VOLCENGINE_RESOURCE_ID }}
      VOLCENGINE_WS_ENDPOINT: ${{ vars.VOLCENGINE_WS_ENDPOINT }}
      VOLCENGINE_OFFICIAL_MANDARIN_PCM_FILE: /tmp/volcengine-natural-mandarin.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify API configuration
        run: test -n "$VOLCENGINE_API_KEY"
      - name: Download integrity-pinned public Mandarin sample
        run: |
          set -eu
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 \
            "https://raw.githubusercontent.com/TencentCloud/tencentcloud-speech-sdk-go/257f9f56bcd592bff1faea9b4ce0f1ef90cea803/examples/speakerexample/test.pcm" \
            -o "$VOLCENGINE_OFFICIAL_MANDARIN_PCM_FILE"
          test "$(wc -c < "$VOLCENGINE_OFFICIAL_MANDARIN_PCM_FILE")" -eq 76360
          test "$(git hash-object "$VOLCENGINE_OFFICIAL_MANDARIN_PCM_FILE")" = 48e5f31375a9e7bad4ad21cd104cdd5714670d25
      - name: Real Volcengine recognition of intelligible Mandarin (strict canary)
        run: go test -tags=integration -run '^TestVolcengineLiveOfficialMandarinCanary$' -count=1 -v -timeout 2m ./asr/providers/volcengine
