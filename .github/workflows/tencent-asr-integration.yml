name: Tencent Cloud ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-asr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TENCENT_APP_ID: ${{ vars.TENCENT_APP_ID }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_ASR_MODEL: ${{ vars.TENCENT_ASR_MODEL }}
      TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL }}
      TENCENT_TEST_PCM_FILE: /tmp/tencent-speech-test.pcm
      TENCENT_TEST_16K_PCM_FILE: /tmp/tencent-speech-test-16k.pcm
      TENCENT_TEST_8K_PCM_FILE: /tmp/tencent-speech-test-8k.pcm
      TENCENT_TEST_SPEAKER_PCM_FILE: /tmp/tencent-speech-speaker-16k.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Tencent Cloud ASR credentials
        run: |
          test -n "$TENCENT_APP_ID" || { echo "TENCENT_APP_ID repository variable is required" >&2; exit 1; }
          test -n "$TENCENT_SECRET_ID" || { echo "TENCENT_SECRET_ID repository secret is required" >&2; exit 1; }
          test -n "$TENCENT_SECRET_KEY" || { echo "TENCENT_SECRET_KEY repository secret is required" >&2; exit 1; }
      - name: Install Mandarin speech fixture tools
        run: |
          if ! command -v espeak-ng >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y espeak-ng ffmpeg || {
              sudo apt-get update -qq
              sudo apt-get install -y espeak-ng ffmpeg
            }
          fi
      - name: Generate mono PCM16LE fixtures for 16k, 8k and configured engine
        run: |
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/tencent-speech.wav" "你好，今天天气很好。我们一起玩游戏。"
          ffmpeg -hide_banner -loglevel error -y -i "${RUNNER_TEMP}/tencent-speech.wav" -ac 1 -ar 16000 -c:a pcm_s16le -f s16le "$TENCENT_TEST_16K_PCM_FILE"
          ffmpeg -hide_banner -loglevel error -y -i "${RUNNER_TEMP}/tencent-speech.wav" -ac 1 -ar 8000 -c:a pcm_s16le -f s16le "$TENCENT_TEST_8K_PCM_FILE"
          rate=16000
          if [[ "$TENCENT_ASR_MODEL" == 8k_* ]]; then
            rate=8000
          fi
          if [[ "$rate" == 8000 ]]; then
            cp "$TENCENT_TEST_8K_PCM_FILE" "$TENCENT_TEST_PCM_FILE"
          else
            cp "$TENCENT_TEST_16K_PCM_FILE" "$TENCENT_TEST_PCM_FILE"
          fi
          test -s "$TENCENT_TEST_16K_PCM_FILE"
          test -s "$TENCENT_TEST_8K_PCM_FILE"
          test -s "$TENCENT_TEST_PCM_FILE"
      - name: Generate distinct-voice speaker fixture (synthetic)
        run: |
          espeak-ng -v en-us -s 125 -w "${RUNNER_TEMP}/tencent-speech-voice-b.wav" "Hello, I am the second speaker. Today we will discuss our learning plans together."
          ffmpeg -hide_banner -loglevel error -y -i "${RUNNER_TEMP}/tencent-speech-voice-b.wav" -ac 1 -ar 16000 -c:a pcm_s16le -f s16le "${RUNNER_TEMP}/tencent-speech-voice-b.pcm"
          head -c 32000 /dev/zero > "${RUNNER_TEMP}/tencent-speech-silence.pcm"
          cat "$TENCENT_TEST_16K_PCM_FILE" "${RUNNER_TEMP}/tencent-speech-silence.pcm" "${RUNNER_TEMP}/tencent-speech-voice-b.pcm" "${RUNNER_TEMP}/tencent-speech-silence.pcm" "$TENCENT_TEST_16K_PCM_FILE" "${RUNNER_TEMP}/tencent-speech-silence.pcm" "${RUNNER_TEMP}/tencent-speech-voice-b.pcm" > "$TENCENT_TEST_SPEAKER_PCM_FILE"
          test -s "$TENCENT_TEST_SPEAKER_PCM_FILE"
      # One real, billable speaker-engine entitlement probe on this branch.
      # Non-gating until the account and speaker_id response are verified.
      # This step sends synthesized single-speaker PCM, not private recordings.
      - name: Probe Tencent Cloud V2 speaker metadata (non-gating)
        continue-on-error: true
        env:
          TENCENT_V2_SPEAKER_MODEL: 16k_zh_en_speaker_2.0
        run: |
          set +e
          go test -tags=integration -run TestTencentLiveV2SpeakerEngine -count=1 -v -timeout 2m ./asr/providers/tencent > "${RUNNER_TEMP}/tencent-v2-speaker.log" 2>&1
          result=$?
          cat "${RUNNER_TEMP}/tencent-v2-speaker.log"
          {
            echo "### Tencent Cloud V2 speaker-enabled real-cloud probe"
            echo "Engine: 16k_zh_en_speaker_2.0 (real, potentially billable, alternating synthesized voices)."
            if [ "$result" -eq 0 ]; then
              echo "Result: **PASS** — speaker metadata fields received from Tencent Cloud."
              grep 'Tencent speaker engine=' "${RUNNER_TEMP}/tencent-v2-speaker.log" || true
            else
              echo "Result: **NOT VERIFIED** — account entitlement or returned speaker metadata needs investigation."
              echo '~~~'
              grep -E 'Tencent ASR error [0-9]+|WebSocket handshake HTTP [0-9]+|returned no speaker_id|--- FAIL: TestTencentLiveV2SpeakerEngine' "${RUNNER_TEMP}/tencent-v2-speaker.log" | tail -n 6 || true
              echo '~~~'
            fi
            echo "Synthesized distinct voices do not establish natural multi-person diarization accuracy."
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "$result"
      - name: Real Tencent Cloud PCM streaming ASR and terminal EOF
        run: go test -tags=integration -run TestTencentLivePCMASR -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud per-request hotword hints
        run: go test -tags=integration -run TestTencentLiveRequestHints -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud concurrent streaming sessions
        run: go test -tags=integration -run TestTencentLiveConcurrentSessions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud sustained PCM and stable EOF
        run: go test -tags=integration -run TestTencentLiveSustainedPCM -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud minute-plus streamed PCM
        run: go test -tags=integration -run TestTencentLiveMinuteStream -count=1 -v -timeout 3m ./asr/providers/tencent
      - name: Compare Tencent Cloud VAD thresholds on synthesized speech
        run: |
          set -o pipefail
          go test -tags=integration -run TestTencentLiveVADComparison -count=1 -v -timeout 3m ./asr/providers/tencent | tee "${RUNNER_TEMP}/tencent-vad-comparison.log"
          {
            echo "### Tencent VAD synthetic-speech comparison"
            echo "Diagnostic only: eSpeak-NG audio is not natural conversational speech. Negative first-final offset can occur if the model splits before the estimated fixture end."
            echo '~~~'
            grep 'VAD_COMPARE' "${RUNNER_TEMP}/tencent-vad-comparison.log" || true
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Real Tencent Cloud customized VAD segmentation
        run: go test -tags=integration -run TestTencentLiveSegmentationOptions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud 8k PCM input to 16k engine
        run: go test -tags=integration -run TestTencentLiveEightKInputToSixteenKEngine -count=1 -v -timeout 2m ./asr/providers/tencent
      # V2 uses caller-paced 40ms PCM frames. These strict, billable gates
      # check independent concurrent streams and a continuous 60s+ session.
      - name: Real Tencent Cloud 2.0 concurrent streams (strict)
        env:
          TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL || '16k_zh_en_2.0' }}
        run: go test -tags=integration -run TestTencentLiveV2ConcurrentSessions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud 2.0 minute-plus stream (strict)
        env:
          TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL || '16k_zh_en_2.0' }}
        run: go test -tags=integration -run TestTencentLiveV2MinuteStream -count=1 -v -timeout 3m ./asr/providers/tencent
      # The speaker-enabled engine has separate entitlement and is not
      # available on every account. Enable explicitly via repository vars.
      # A single synthesized voice checks metadata plumbing, not diarization quality.
      - name: Real Tencent Cloud V2 speaker metadata (opt-in)
        if: ${{ vars.TENCENT_V2_SPEAKER_MODEL != '' }}
        env:
          TENCENT_V2_SPEAKER_MODEL: ${{ vars.TENCENT_V2_SPEAKER_MODEL }}
        run: go test -tags=integration -run TestTencentLiveV2SpeakerEngine -count=1 -v -timeout 2m ./asr/providers/tencent
      # Real 2.0 PCM recognition succeeded on this account (2026-11-19).
      # Run a strict, paid gate on every push so entitlement/protocol regressions
      # cannot silently pass. Repository variable optionally overrides engine.
      - name: Real Tencent Cloud large-model 2.0 (automatic, strict)
        env:
          TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL || '16k_zh_en_2.0' }}
        run: |
          if go test -tags=integration -run TestTencentLiveLargeModelV2 -count=1 -v -timeout 2m ./asr/providers/tencent > "${RUNNER_TEMP}/tencent-v2-live.log" 2>&1; then
            cat "${RUNNER_TEMP}/tencent-v2-live.log"
            {
              echo "### Tencent Cloud ASR 2.0"
              echo "Model: ${TENCENT_V2_ASR_MODEL}"
              echo "Result: **PASS** — nonempty Final and stable EOF returned by real cloud."
              grep 'Tencent large model 2.0' "${RUNNER_TEMP}/tencent-v2-live.log" || true
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            cat "${RUNNER_TEMP}/tencent-v2-live.log"
            {
              echo "### Tencent Cloud ASR 2.0"
              echo "Model: ${TENCENT_V2_ASR_MODEL}"
              echo "Result: **FAIL** — automatic strict cloud gate failed; see test logs."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

  # Temporary, branch-only fast probe: downloads Tencent's official public
  # PCM fixture. Avoids apt/FFmpeg/eSpeak setup while debugging this SKU.
  speaker-fast-probe:
    if: github.ref == 'refs/heads/test/tencent-v2-speaker-cloud-entitlement'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TENCENT_APP_ID: ${{ vars.TENCENT_APP_ID }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_V2_SPEAKER_MODEL: 16k_zh_en_speaker_2.0
      TENCENT_TEST_16K_PCM_FILE: /tmp/tencent-official-speech.pcm
      TENCENT_TEST_SPEAKER_PCM_FILE: /tmp/tencent-official-speaker-extended.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare Tencent official public PCM (no codec packages)
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 \
            "https://raw.githubusercontent.com/TencentCloud/tencentcloud-speech-sdk-go/257f9f56bcd592bff1faea9b4ce0f1ef90cea803/examples/speakerexample/test.pcm" \
            -o "$TENCENT_TEST_16K_PCM_FILE"
          test "$(git hash-object "$TENCENT_TEST_16K_PCM_FILE")" = "48e5f31375a9e7bad4ad21cd104cdd5714670d25"
          for i in $(seq 1 12); do cat "$TENCENT_TEST_16K_PCM_FILE"; done > "$TENCENT_TEST_SPEAKER_PCM_FILE"
          test -s "$TENCENT_TEST_SPEAKER_PCM_FILE"
      - name: Probe speaker sentence mode with public audio
        continue-on-error: true
        run: |
          go test -tags=integration -run TestTencentLiveV2SpeakerEngine -count=1 -v -timeout 2m ./asr/providers/tencent
