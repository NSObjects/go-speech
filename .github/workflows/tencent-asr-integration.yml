name: Tencent Cloud ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TENCENT_APP_ID: ${{ vars.TENCENT_APP_ID }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_ASR_MODEL: ${{ vars.TENCENT_ASR_MODEL }}
      TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL }}
      TENCENT_TEST_PCM_FILE: /tmp/tencent-speech-test.pcm
      TENCENT_TEST_16K_PCM_FILE: /tmp/tencent-speech-test-16k.pcm
      TENCENT_TEST_8K_PCM_FILE: /tmp/tencent-speech-test-8k.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Tencent Cloud ASR credentials
        run: |
          test -n "$TENCENT_APP_ID" || { echo "TENCENT_APP_ID repository variable is required" >&2; exit 1; }
          test -n "$TENCENT_SECRET_ID" || { echo "TENCENT_SECRET_ID repository secret is required" >&2; exit 1; }
          test -n "$TENCENT_SECRET_KEY" || { echo "TENCENT_SECRET_KEY repository secret is required" >&2; exit 1; }
      - name: Install Mandarin speech fixture tools
        run: |
          if ! command -v espeak-ng >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y espeak-ng ffmpeg || {
              sudo apt-get update -qq
              sudo apt-get install -y espeak-ng ffmpeg
            }
          fi
      - name: Generate mono PCM16LE fixtures for 16k, 8k and configured engine
        run: |
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/tencent-speech.wav" "你好，今天天气很好。我们一起玩游戏。"
          ffmpeg -hide_banner -loglevel error -y -i "${RUNNER_TEMP}/tencent-speech.wav" -ac 1 -ar 16000 -c:a pcm_s16le -f s16le "$TENCENT_TEST_16K_PCM_FILE"
          ffmpeg -hide_banner -loglevel error -y -i "${RUNNER_TEMP}/tencent-speech.wav" -ac 1 -ar 8000 -c:a pcm_s16le -f s16le "$TENCENT_TEST_8K_PCM_FILE"
          rate=16000
          if [[ "$TENCENT_ASR_MODEL" == 8k_* ]]; then
            rate=8000
          fi
          if [[ "$rate" == 8000 ]]; then
            cp "$TENCENT_TEST_8K_PCM_FILE" "$TENCENT_TEST_PCM_FILE"
          else
            cp "$TENCENT_TEST_16K_PCM_FILE" "$TENCENT_TEST_PCM_FILE"
          fi
          test -s "$TENCENT_TEST_16K_PCM_FILE"
          test -s "$TENCENT_TEST_8K_PCM_FILE"
          test -s "$TENCENT_TEST_PCM_FILE"
      - name: Real Tencent Cloud PCM streaming ASR and terminal EOF
        run: go test -tags=integration -run TestTencentLivePCMASR -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud per-request hotword hints
        run: go test -tags=integration -run TestTencentLiveRequestHints -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud concurrent streaming sessions
        run: go test -tags=integration -run TestTencentLiveConcurrentSessions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud sustained PCM and stable EOF
        run: go test -tags=integration -run TestTencentLiveSustainedPCM -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud minute-plus streamed PCM
        run: go test -tags=integration -run TestTencentLiveMinuteStream -count=1 -v -timeout 3m ./asr/providers/tencent
      - name: Compare Tencent Cloud VAD thresholds on synthesized speech
        run: |
          set -o pipefail
          go test -tags=integration -run TestTencentLiveVADComparison -count=1 -v -timeout 3m ./asr/providers/tencent | tee "${RUNNER_TEMP}/tencent-vad-comparison.log"
          {
            echo "### Tencent VAD synthetic-speech comparison"
            echo "Diagnostic only: eSpeak-NG audio is not natural conversational speech. Negative first-final offset can occur if the model splits before the estimated fixture end."
            echo '~~~'
            grep 'VAD_COMPARE' "${RUNNER_TEMP}/tencent-vad-comparison.log" || true
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Real Tencent Cloud customized VAD segmentation
        run: go test -tags=integration -run TestTencentLiveSegmentationOptions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud 8k PCM input to 16k engine
        run: go test -tags=integration -run TestTencentLiveEightKInputToSixteenKEngine -count=1 -v -timeout 2m ./asr/providers/tencent
      # When the repository variable is unset, perform a real 2.0 probe
      # with the existing Tencent credentials. Account entitlement may be
      # missing, so this diagnostic must never block working legacy engines.
      - name: Probe Tencent Cloud 2.0 (automatic, non-gating)
        if: ${{ !vars.TENCENT_V2_ASR_MODEL }}
        continue-on-error: true
        env:
          TENCENT_V2_ASR_MODEL: 16k_zh_en_2.0
        run: |
          set +e
          go test -tags=integration -run TestTencentLiveLargeModelV2 -count=1 -v -timeout 2m ./asr/providers/tencent > "${RUNNER_TEMP}/tencent-v2-probe.log" 2>&1
          result=$?
          cat "${RUNNER_TEMP}/tencent-v2-probe.log"
          {
            echo "### Tencent Cloud 2.0 live diagnostic"
            echo "Model: \`16k_zh_en_2.0\`. This is a real, potentially billable Tencent Cloud request."
            if [ "$result" -eq 0 ]; then
              echo "Result: **PASS** — real V2 recognition returned nonempty Final text and stable EOF."
            else
              echo "Result: **NOT VERIFIED** — probe failed, but legacy ASR CI remains gated separately."
              echo '~~~'
              grep -E 'Tencent ASR error [0-9]+|WebSocket handshake HTTP [0-9]+|--- FAIL: TestTencentLiveLargeModelV2' "${RUNNER_TEMP}/tencent-v2-probe.log" | tail -n 5 || true
              echo '~~~'
            fi
            echo "Configure repository variable \`TENCENT_V2_ASR_MODEL\` to enforce a strict, blocking 2.0 gate."
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "$result"
      # An explicitly configured, entitled 2.0 model must pass like all
      # other ASR integration gates; this step must NOT continue-on-error.
      - name: Real Tencent Cloud 2.0 (strict for configured model)
        if: ${{ vars.TENCENT_V2_ASR_MODEL }}
        run: go test -tags=integration -run TestTencentLiveLargeModelV2 -count=1 -v -timeout 2m ./asr/providers/tencent
