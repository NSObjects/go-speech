name: Tencent Cloud ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:
    inputs:
      emotion_engine:
        description: 'Optional paid emotion diagnostic (currently unverified)'
        type: choice
        default: disabled
        options:
          - disabled
          - 16k_zh
          - 16k_zh_en
          - 8k_zh
          - 8k_zh_large

permissions:
  contents: read

jobs:
  live-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TENCENT_APP_ID: ${{ vars.TENCENT_APP_ID }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_ASR_MODEL: ${{ vars.TENCENT_ASR_MODEL }}
      TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL }}
      TENCENT_TEST_PCM_FILE: /tmp/tencent-speech-test.pcm
      TENCENT_TEST_16K_PCM_FILE: /tmp/tencent-speech-test-16k.pcm
      TENCENT_TEST_8K_PCM_FILE: /tmp/tencent-speech-test-8k.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Tencent Cloud ASR credentials
        run: |
          test -n "$TENCENT_APP_ID" || { echo "TENCENT_APP_ID repository variable is required" >&2; exit 1; }
          test -n "$TENCENT_SECRET_ID" || { echo "TENCENT_SECRET_ID repository secret is required" >&2; exit 1; }
          test -n "$TENCENT_SECRET_KEY" || { echo "TENCENT_SECRET_KEY repository secret is required" >&2; exit 1; }
      # Use the same SHA-verified public Tencent speech sample as speaker-live.
      # Avoid apt package installation and eSpeak voice/package drift.
      - name: Prepare pinned Tencent PCM fixtures (16k and 8k)
        run: |
          set -euo pipefail
          source_pcm="${RUNNER_TEMP}/tencent-official-source.pcm"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 \
            "https://raw.githubusercontent.com/TencentCloud/tencentcloud-speech-sdk-go/257f9f56bcd592bff1faea9b4ce0f1ef90cea803/examples/speakerexample/test.pcm" \
            -o "$source_pcm"
          test "$(git hash-object "$source_pcm")" = "48e5f31375a9e7bad4ad21cd104cdd5714670d25"
          : > "$TENCENT_TEST_16K_PCM_FILE"
          for i in 1 2 3; do cat "$source_pcm" >> "$TENCENT_TEST_16K_PCM_FILE"; done
          test -s "$TENCENT_TEST_16K_PCM_FILE"
          # Exact 2:1 rate conversion for protocol coverage, using Python stdlib.
          # Adjacent-sample averaging avoids external codec/package dependencies.
          python3 - <<'PY'
          from array import array
          from pathlib import Path
          import os
          import sys

          raw = Path(os.environ["TENCENT_TEST_16K_PCM_FILE"]).read_bytes()
          if len(raw) % 4:
              raise SystemExit("16k PCM must have an even number of 16-bit samples")
          samples = array("h")
          samples.frombytes(raw)
          if sys.byteorder != "little":
              samples.byteswap()
          reduced = array("h", (
              (int(samples[i]) + int(samples[i + 1])) // 2
              for i in range(0, len(samples), 2)
          ))
          if sys.byteorder != "little":
              reduced.byteswap()
          Path(os.environ["TENCENT_TEST_8K_PCM_FILE"]).write_bytes(reduced.tobytes())
          PY
          if [[ "$TENCENT_ASR_MODEL" == 8k_* ]]; then
            cp "$TENCENT_TEST_8K_PCM_FILE" "$TENCENT_TEST_PCM_FILE"
          else
            cp "$TENCENT_TEST_16K_PCM_FILE" "$TENCENT_TEST_PCM_FILE"
          fi
          test -s "$TENCENT_TEST_16K_PCM_FILE"
          test -s "$TENCENT_TEST_8K_PCM_FILE"
          test -s "$TENCENT_TEST_PCM_FILE"
      # Paid gates verify API/auth, audio transport, options and stable EOF.
      # Recognition quality and CER are not SDK acceptance criteria.
      - name: Real Tencent Cloud PCM streaming ASR and terminal EOF
        run: go test -tags=integration -run TestTencentLivePCMASR -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Short-audio Recognize (complete PCM input and final text)
        run: go test -tags=integration -run '^TestTencentLiveShortRecognize$' -count=1 -v -timeout 2m ./asr/providers/tencent

      - name: Real Tencent Cloud native WAV WebSocket recognition
        run: go test -tags=integration -run '^TestTencentLiveWAVRecognize$' -count=1 -v -timeout 2m ./asr/providers/tencent

      # Independent native Opus fixture: real-cloud verification confirmed LE.
      - name: Install libopus runtime for protocol fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0
          python3 -c 'import ctypes; ctypes.CDLL("libopus.so.0")'
      - name: Prepare native 40ms Opus fixture
        run: |
          python3 - <<'PY'
          import ctypes as c
          import os
          import struct
          from pathlib import Path

          lib = c.CDLL("libopus.so.0")
          lib.opus_encoder_create.argtypes = [c.c_int32, c.c_int, c.c_int, c.POINTER(c.c_int)]
          lib.opus_encoder_create.restype = c.c_void_p
          lib.opus_encode.argtypes = [c.c_void_p, c.POINTER(c.c_int16), c.c_int, c.POINTER(c.c_ubyte), c.c_int32]
          lib.opus_encode.restype = c.c_int32
          lib.opus_encoder_destroy.argtypes = [c.c_void_p]
          lib.opus_encoder_destroy.restype = None

          raw = Path(os.environ["TENCENT_TEST_16K_PCM_FILE"]).read_bytes()
          if not raw or len(raw) % 2:
              raise SystemExit("invalid PCM fixture")
          raw += bytes((-len(raw)) % 1280)
          code = c.c_int()
          enc = lib.opus_encoder_create(16000, 1, 2048, c.byref(code))
          if not enc or code.value != 0:
              raise SystemExit(f"opus_encoder_create failed: {code.value}")
          result = bytearray()
          try:
              for off in range(0, len(raw), 1280):
                  samples = (c.c_int16 * 640)(*struct.unpack("<640h", raw[off:off+1280]))
                  output = (c.c_ubyte * 4000)()
                  n = lib.opus_encode(enc, samples, 640, output, len(output))
                  if not 0 < n <= 1275:
                      raise SystemExit(f"opus_encode returned {n}")
                  result += b"opus" + struct.pack("<H", n) + bytes(output[:n])
          finally:
              lib.opus_encoder_destroy(enc)
          Path(os.environ["RUNNER_TEMP"], "tencent-opus-le.frames").write_bytes(result)
          print(f"encoded {len(raw)//1280} 40ms packets, {len(result)} framed bytes")
          PY
      - name: Real Tencent native Opus Recognize and OpenStream
        env:
          TENCENT_TEST_OPUS_LE_FILE: ${{ runner.temp }}/tencent-opus-le.frames
        run: go test -tags=integration -run '^TestTencentLiveNativeOpus$' -count=1 -v -timeout 2m ./asr/providers/tencent

      - name: Prepare native MP3 fixture
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -f s16le -ar 16000 -ac 1 -i "$TENCENT_TEST_16K_PCM_FILE" -c:a libmp3lame -b:a 32k -ar 16000 -ac 1 "$RUNNER_TEMP/tencent-native.mp3"
      - name: Real Tencent native MP3 WebSocket recognition
        env:
          TENCENT_TEST_MP3_FILE: ${{ runner.temp }}/tencent-native.mp3
        run: go test -tags=integration -run '^TestTencentLiveNativeMP3$' -count=1 -v -timeout 2m ./asr/providers/tencent

      - name: Prepare native AAC-LC ADTS fixture
        run: |
          ffmpeg -hide_banner -loglevel error -y -f s16le -ar 16000 -ac 1 -i "$TENCENT_TEST_16K_PCM_FILE" -c:a aac -profile:a aac_low -b:a 32k -ar 16000 -ac 1 -f adts "$RUNNER_TEMP/tencent-native.aac"
      - name: Real Tencent native AAC WebSocket recognition
        env:
          TENCENT_TEST_AAC_FILE: ${{ runner.temp }}/tencent-native.aac
        run: go test -tags=integration -run '^TestTencentLiveNativeAAC$' -count=1 -v -timeout 2m ./asr/providers/tencent

      # Diagnostic only: Tencent documents Speex/SP but not its container.
      - name: Prepare 16k mono Ogg Speex protocol fixture
        run: |
          ffmpeg -hide_banner -loglevel error -y -f s16le -ar 16000 -ac 1 -i "$TENCENT_TEST_16K_PCM_FILE" -c:a libspeex -ar 16000 -ac 1 -frames_per_packet 1 -page_duration 200000 -f ogg "$RUNNER_TEMP/tencent-speex.spx"
          test -s "$RUNNER_TEMP/tencent-speex.spx"
      - name: Probe real Tencent ASR Ogg Speex compatibility
        env:
          TENCENT_TEST_SPEEX_FILE: ${{ runner.temp }}/tencent-speex.spx
        run: go test -tags=integration -run '^TestTencentLiveOggSpeexProbe$' -count=1 -v -timeout 2m ./asr/providers/tencent

      - name: Real Tencent Cloud per-request hotword hints
        run: go test -tags=integration -run TestTencentLiveRequestHints -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud concurrent streaming sessions
        run: go test -tags=integration -run TestTencentLiveConcurrentSessions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud 8k PCM input to 16k engine
        run: go test -tags=integration -run TestTencentLiveEightKInputToSixteenKEngine -count=1 -v -timeout 2m ./asr/providers/tencent
      # V2 uses caller-paced 40ms PCM frames. These strict, billable gates
      # check independent concurrent streams and stable completion.
      - name: Real Tencent Cloud 2.0 concurrent streams (strict)
        env:
          TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL || '16k_zh_en_2.0' }}
        run: go test -tags=integration -run TestTencentLiveV2ConcurrentSessions -count=1 -v -timeout 2m ./asr/providers/tencent
      - name: Real Tencent Cloud large-model 2.0 (automatic, strict)
        env:
          TENCENT_V2_ASR_MODEL: ${{ vars.TENCENT_V2_ASR_MODEL || '16k_zh_en_2.0' }}
        run: |
          if go test -tags=integration -run TestTencentLiveLargeModelV2 -count=1 -v -timeout 2m ./asr/providers/tencent > "${RUNNER_TEMP}/tencent-v2-live.log" 2>&1; then
            cat "${RUNNER_TEMP}/tencent-v2-live.log"
            {
              echo "### Tencent Cloud ASR 2.0"
              echo "Model: ${TENCENT_V2_ASR_MODEL}"
              echo "Result: **PASS** — nonempty Final and stable EOF returned by real cloud."
              grep 'Tencent large model 2.0' "${RUNNER_TEMP}/tencent-v2-live.log" || true
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            cat "${RUNNER_TEMP}/tencent-v2-live.log"
            {
              echo "### Tencent Cloud ASR 2.0"
              echo "Model: ${TENCENT_V2_ASR_MODEL}"
              echo "Result: **FAIL** — automatic strict cloud gate failed; see test logs."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      # Known cloud rejection on all documented engines. Only re-probe on explicit request.
      - name: Optional Tencent Cloud legacy emotion metadata (paid)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emotion_engine != 'disabled' }}
        env:
          TENCENT_EMOTION_TEST_ENGINE: ${{ inputs.emotion_engine }}
        run: |
          set -euo pipefail
          go test -tags=integration -run '^TestTencentLiveEmotionMetadata$' -count=1 -v -timeout 2m ./asr/providers/tencent | tee "$RUNNER_TEMP/tencent-emotion.log"
          if grep -q 'NOT VALIDATED:' "$RUNNER_TEMP/tencent-emotion.log"; then
            echo "### Tencent ASR emotion: request accepted; label schema unconfirmed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Strict, paid speaker-enabled V2 ASR gate. A pinned 16kHz sample from the
  # official Tencent Go SDK eliminates dependency on apt-based fixture tools.
  # It proves speech and speaker-ID transport, not diarization accuracy.
  speaker-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TENCENT_APP_ID: ${{ vars.TENCENT_APP_ID }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_V2_SPEAKER_MODEL: 16k_zh_en_speaker_2.0
      TENCENT_TEST_16K_PCM_FILE: /tmp/tencent-official-speech.pcm
      TENCENT_TEST_SPEAKER_PCM_FILE: /tmp/tencent-official-speaker-extended.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare Tencent official public PCM (no codec packages)
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 \
            "https://raw.githubusercontent.com/TencentCloud/tencentcloud-speech-sdk-go/257f9f56bcd592bff1faea9b4ce0f1ef90cea803/examples/speakerexample/test.pcm" \
            -o "$TENCENT_TEST_16K_PCM_FILE"
          test "$(git hash-object "$TENCENT_TEST_16K_PCM_FILE")" = "48e5f31375a9e7bad4ad21cd104cdd5714670d25"
          for i in $(seq 1 12); do cat "$TENCENT_TEST_16K_PCM_FILE"; done > "$TENCENT_TEST_SPEAKER_PCM_FILE"
          test -s "$TENCENT_TEST_SPEAKER_PCM_FILE"
      - name: Real Tencent Cloud V2 speaker model and speaker ID (strict)
        run: |
          go test -tags=integration -run TestTencentLiveV2SpeakerEngine -count=1 -v -timeout 2m ./asr/providers/tencent

      - name: Real Tencent speaker context issuance and reuse
        run: go test -tags=integration -run '^TestTencentLiveV2SpeakerContext$' -count=1 -v -timeout 3m ./asr/providers/tencent
