name: Volcengine ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      VOLCENGINE_RESOURCE_ID: ${{ vars.VOLCENGINE_RESOURCE_ID }}
      VOLCENGINE_WS_ENDPOINT: ${{ vars.VOLCENGINE_WS_ENDPOINT }}
      VOLCENGINE_TEST_PCM_FILE: /tmp/volcengine-test.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require new-console Volcengine API Key
        run: |
          if [ -z "$VOLCENGINE_API_KEY" ]; then
            echo "::error title=Missing API key::Set VOLCENGINE_API_KEY to the new-console APP Key in Repository secrets."
            exit 1
          fi
      - name: Install speech fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate two-utterance real spoken-audio PCM fixture
        run: |
          # Two distinct utterances separated by 2s of PCM silence. A trailing
          # 1s silence lets the server commit the second definite sentence.
          espeak-ng -v en -s 130 -w "${RUNNER_TEMP}/first.wav" \
            "The red apple is on the table."
          espeak-ng -v en -s 130 -w "${RUNNER_TEMP}/second.wav" \
            "The blue car is parked outside."
          for part in first second; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "${RUNNER_TEMP}/${part}.wav" -ac 1 -ar 16000 \
              -c:a pcm_s16le -f s16le "${RUNNER_TEMP}/${part}.pcm"
          done
          head -c 64000 /dev/zero > "${RUNNER_TEMP}/between.pcm"
          head -c 32000 /dev/zero > "${RUNNER_TEMP}/after.pcm"
          cat "${RUNNER_TEMP}/first.pcm" "${RUNNER_TEMP}/between.pcm" \
            "${RUNNER_TEMP}/second.pcm" "${RUNNER_TEMP}/after.pcm" \
            > "$VOLCENGINE_TEST_PCM_FILE"
          test -s "$VOLCENGINE_TEST_PCM_FILE"
      - name: Test real optimized bidirectional ASR
        run: go test -tags=integration -run '^(TestVolcengineLiveASR|TestVolcengineLiveSilence)$' -count=1 -v -timeout 3m ./asr/providers/volcengine
