name: Volcengine ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-asr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      VOLCENGINE_RESOURCE_ID: ${{ vars.VOLCENGINE_RESOURCE_ID }}
      VOLCENGINE_WS_ENDPOINT: ${{ vars.VOLCENGINE_WS_ENDPOINT }}
      VOLCENGINE_TEST_PCM_FILE: /tmp/volcengine-test.pcm
      VOLCENGINE_SHORT_PCM_FILE: /tmp/volcengine-short.pcm
      VOLCENGINE_MANDARIN_PCM_FILE: /tmp/volcengine-mandarin.pcm
      VOLCENGINE_MANDARIN_SHORT_PCM_FILE: /tmp/volcengine-mandarin-short.pcm
      VOLCENGINE_CONTINUOUS_PCM_FILE: /tmp/volcengine-continuous.pcm
      VOLCENGINE_MINUTE_PCM_FILE: /tmp/volcengine-minute.pcm
      VOLCENGINE_OGG_OPUS_FILE: /tmp/volcengine-ogg-opus.ogg
      VOLCENGINE_CONTINUOUS_OGG_OPUS_FILE: /tmp/volcengine-continuous.ogg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require new-console Volcengine API Key
        run: |
          if [ -z "$VOLCENGINE_API_KEY" ]; then
            echo "::error title=Missing API key::Set VOLCENGINE_API_KEY to the new-console APP Key in Repository secrets."
            exit 1
          fi
      - name: Install speech fixture tools
        run: |
          sudo apt-get install -y espeak-ng ffmpeg || {
            sudo apt-get update -qq
            sudo apt-get install -y espeak-ng ffmpeg
          }
      - name: Generate two-utterance real spoken-audio PCM fixture
        run: |
          # Two distinct utterances separated by 2s of PCM silence. A trailing
          # 1s silence lets the server commit the second definite sentence.
          espeak-ng -v en -s 130 -w "${RUNNER_TEMP}/first.wav" \
            "The red apple is on the table."
          espeak-ng -v en -s 130 -w "${RUNNER_TEMP}/second.wav" \
            "The blue car is parked outside."
          for part in first second; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "${RUNNER_TEMP}/${part}.wav" -ac 1 -ar 16000 \
              -c:a pcm_s16le -f s16le "${RUNNER_TEMP}/${part}.pcm"
          done
          head -c 64000 /dev/zero > "${RUNNER_TEMP}/between.pcm"
          head -c 32000 /dev/zero > "${RUNNER_TEMP}/after.pcm"
          cat "${RUNNER_TEMP}/first.pcm" "${RUNNER_TEMP}/between.pcm" \
            "${RUNNER_TEMP}/second.pcm" "${RUNNER_TEMP}/after.pcm" \
            > "$VOLCENGINE_TEST_PCM_FILE"
          test -s "$VOLCENGINE_TEST_PCM_FILE"
      - name: Generate short-phrase spoken-audio PCM fixture
        run: |
          espeak-ng -v en -s 180 -w "${RUNNER_TEMP}/short.wav" "Hello."
          ffmpeg -hide_banner -loglevel error -y \
            -i "${RUNNER_TEMP}/short.wav" -ac 1 -ar 16000 \
            -c:a pcm_s16le -f s16le "${RUNNER_TEMP}/short-voice.pcm"
          head -c 32000 /dev/zero > "${RUNNER_TEMP}/short-tail.pcm"
          cat "${RUNNER_TEMP}/short-voice.pcm" "${RUNNER_TEMP}/short-tail.pcm" > "$VOLCENGINE_SHORT_PCM_FILE"
          test -s "$VOLCENGINE_SHORT_PCM_FILE"
      - name: Generate Mandarin spoken-audio fixtures
        run: |
          # eSpeak NG's Mandarin voice supplies offline synthetic test inputs.
          # Keep fixtures separate from the SDK, which does not implement TTS.
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/mandarin.wav" "今天天气很好。"
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/mandarin-short.wav" "你好。"
          for part in mandarin mandarin-short; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "${RUNNER_TEMP}/${part}.wav" -ac 1 -ar 16000 \
              -c:a pcm_s16le -f s16le "${RUNNER_TEMP}/${part}.pcm"
          done
          # Flush final recognition without introducing another utterance.
          head -c 32000 /dev/zero > "${RUNNER_TEMP}/mandarin-tail.pcm"
          cat "${RUNNER_TEMP}/mandarin.pcm" "${RUNNER_TEMP}/mandarin-tail.pcm" > "$VOLCENGINE_MANDARIN_PCM_FILE"
          cat "${RUNNER_TEMP}/mandarin-short.pcm" "${RUNNER_TEMP}/mandarin-tail.pcm" > "$VOLCENGINE_MANDARIN_SHORT_PCM_FILE"
          test -s "$VOLCENGINE_MANDARIN_PCM_FILE"
          test -s "$VOLCENGINE_MANDARIN_SHORT_PCM_FILE"
      - name: Generate continuous Mandarin conversation PCM fixture
        run: |
          # Four turns: repeat two full phrases; three 2s silences.
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/turn1.wav" "今天天气很好。"
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/turn2.wav" "我们一起玩游戏。"
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/turn3.wav" "今天天气很好。"
          espeak-ng -v zh -s 125 -w "${RUNNER_TEMP}/turn4.wav" "我们一起玩游戏。"
          for part in turn1 turn2 turn3 turn4; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "${RUNNER_TEMP}/${part}.wav" -ac 1 -ar 16000 \
              -c:a pcm_s16le -f s16le "${RUNNER_TEMP}/${part}.pcm"
          done
          head -c 64000 /dev/zero > "${RUNNER_TEMP}/gap.pcm"
          head -c 32000 /dev/zero > "${RUNNER_TEMP}/tail.pcm"
          cat "${RUNNER_TEMP}/turn1.pcm" "${RUNNER_TEMP}/gap.pcm" \
            "${RUNNER_TEMP}/turn2.pcm" "${RUNNER_TEMP}/gap.pcm" \
            "${RUNNER_TEMP}/turn3.pcm" "${RUNNER_TEMP}/gap.pcm" \
            "${RUNNER_TEMP}/turn4.pcm" "${RUNNER_TEMP}/tail.pcm" \
            > "$VOLCENGINE_CONTINUOUS_PCM_FILE"
          test -s "$VOLCENGINE_CONTINUOUS_PCM_FILE"
      - name: Generate minute-long continuous Mandarin fixture
        run: |
          # Twelve whole phrases on a single stream, 4s apart. Keep fixture
          # construction out of the SDK; no implicit audio transcoding.
          head -c 128000 /dev/zero > "${RUNNER_TEMP}/minute-gap.pcm"
          (
            for n in $(seq 1 12); do
              if [ $((n % 2)) -eq 1 ]; then
                cat "${RUNNER_TEMP}/turn1.pcm"
              else
                cat "${RUNNER_TEMP}/turn2.pcm"
              fi
              if [ "$n" -lt 12 ]; then
                cat "${RUNNER_TEMP}/minute-gap.pcm"
              else
                cat "${RUNNER_TEMP}/tail.pcm"
              fi
            done
          ) > "$VOLCENGINE_MINUTE_PCM_FILE"
          test "$(stat -c %s "$VOLCENGINE_MINUTE_PCM_FILE")" -ge 1920000
      - name: Generate genuine Ogg Opus fixture from Mandarin PCM
        run: |
          # The official optimized ASR API requires format=ogg, codec=opus.
          # A complete continuous Ogg stream is NOT the same as raw Opus packets.
          ffmpeg -hide_banner -loglevel error -y -f s16le -ar 16000 -ac 1 \
            -i "$VOLCENGINE_MANDARIN_PCM_FILE" -c:a libopus \
            -application voip -b:a 24000 -ar 16000 -ac 1 \
            -frame_duration 20 -page_duration 200000 -f ogg \
            "$VOLCENGINE_OGG_OPUS_FILE"
          test -s "$VOLCENGINE_OGG_OPUS_FILE"
          ffprobe -v error -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 "$VOLCENGINE_OGG_OPUS_FILE" | grep -q 'codec_name=opus'
      - name: Generate continuous Ogg Opus conversation fixture
        run: |
          # A single Ogg logical bitstream, never concatenated Ogg files.
          ffmpeg -hide_banner -loglevel error -y -f s16le -ar 16000 -ac 1 \
            -i "$VOLCENGINE_CONTINUOUS_PCM_FILE" -c:a libopus \
            -application voip -b:a 24000 -ar 16000 -ac 1 \
            -frame_duration 20 -page_duration 200000 -f ogg \
            "$VOLCENGINE_CONTINUOUS_OGG_OPUS_FILE"
          test -s "$VOLCENGINE_CONTINUOUS_OGG_OPUS_FILE"
          ffprobe -v error -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 "$VOLCENGINE_CONTINUOUS_OGG_OPUS_FILE" | grep -q 'codec_name=opus'
      - name: Gate real streaming ASR (PCM, Ogg Opus, Go raw-packet remux)
        run: go test -tags=integration -run '^(TestVolcengineLiveASR|TestVolcengineLiveSilence|TestVolcengineLiveMandarin|TestVolcengineLiveContinuousMandarin|TestVolcengineLiveMinuteSession|TestVolcengineLiveOggOpus|TestVolcengineLiveContinuousOggOpus|TestVolcengineLiveRawOpusRemux)$' -count=1 -v -timeout 8m ./asr/providers/volcengine
      - name: Diagnose ultra-short synthetic English speech recognition
        id: short_phrase
        continue-on-error: true
        run: go test -tags=integration -run '^TestVolcengineLiveShortSpeech$' -count=1 -v -timeout 45s ./asr/providers/volcengine
      - name: Report short-speech quality failure without masking transport checks
        if: always() && steps.short_phrase.outcome == 'failure'
        run: |
          echo "::warning title=Short synthetic speech ASR quality::Synthetic English Hello had no confirmed recognition (or was misrecognized). Inspect the failed diagnostic step; no claim of short-utterance reliability."
          echo "Short synthetic English speech recognition FAILED in this cloud run. This is an unresolved quality concern; see the diagnostic step log." >> "$GITHUB_STEP_SUMMARY"
