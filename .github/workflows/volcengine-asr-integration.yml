name: Volcengine ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Only ASR vendor API acceptance: authentication, PCM/Ogg transport,
# result types, Final events, half-close and repeatable EOF.
# No CER, word-level comparison, long-session or VAD-quality benchmarks.
jobs:
  live-asr:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nsobjects/go-speech-ci:sha-97c09deafd7c79bcf75e85e9bd3147d7f0299f87
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 5
    env:
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      VOLCENGINE_RESOURCE_ID: ${{ vars.VOLCENGINE_RESOURCE_ID }}
      VOLCENGINE_WS_ENDPOINT: ${{ vars.VOLCENGINE_WS_ENDPOINT }}
      VOLCENGINE_TEST_PCM_FILE: /tmp/volcengine-smoke.pcm
      VOLCENGINE_OGG_OPUS_FILE: /tmp/volcengine-smoke.ogg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Volcengine credentials and preinstalled codec tools
        run: |
          test -n "$VOLCENGINE_API_KEY"
          command -v ffmpeg
          command -v ffprobe
      - name: Prepare pinned PCM and Ogg Opus protocol fixtures
        run: |
          set -eu
          source_pcm="$RUNNER_TEMP/volcengine-official.pcm"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 \
            "https://raw.githubusercontent.com/TencentCloud/tencentcloud-speech-sdk-go/257f9f56bcd592bff1faea9b4ce0f1ef90cea803/examples/speakerexample/test.pcm" \
            -o "$source_pcm"
          test "$(git hash-object "$source_pcm")" = 48e5f31375a9e7bad4ad21cd104cdd5714670d25
          # Allow server VAD to finish without asserting transcript wording.
          head -c 48000 /dev/zero > "$RUNNER_TEMP/volcengine-tail.pcm"
          cat "$source_pcm" "$RUNNER_TEMP/volcengine-tail.pcm" > "$VOLCENGINE_TEST_PCM_FILE"
          ffmpeg -hide_banner -loglevel error -y \
            -f s16le -ar 16000 -ac 1 -i "$VOLCENGINE_TEST_PCM_FILE" \
            -c:a libopus -application voip -b:a 24000 -ar 16000 -ac 1 \
            -frame_duration 20 -page_duration 200000 -f ogg "$VOLCENGINE_OGG_OPUS_FILE"
          test -s "$VOLCENGINE_TEST_PCM_FILE"
          test -s "$VOLCENGINE_OGG_OPUS_FILE"
          ffprobe -v error -show_entries stream=codec_name -of default=noprint_wrappers=1 \
            "$VOLCENGINE_OGG_OPUS_FILE" | grep 'codec_name=opus'
      - name: Short-audio Recognize (complete PCM input and final text)
        run: go test -tags=integration -run '^TestVolcengineLiveShortRecognize$' -count=1 -v -timeout 2m ./asr/providers/volcengine

      - name: Real Volcengine PCM and Ogg Opus API, Final and stable EOF
        run: |
          go test -tags=integration \
            -run '^(TestVolcengineLiveASR|TestVolcengineLiveOggOpus)$' \
            -count=1 -v -timeout 3m ./asr/providers/volcengine

      - name: Experimental Volcengine post-final physical socket reuse
        run: go test -tags=integration -run '^TestVolcengineLiveReuseProbe$' -count=1 -v -timeout 100s ./asr/providers/volcengine
