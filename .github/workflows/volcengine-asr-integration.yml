name: Volcengine ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
      VOLCENGINE_APP_ID: ${{ vars.VOLCENGINE_APP_ID || secrets.VOLCENGINE_APP_ID }}
      VOLCENGINE_ACCESS_TOKEN: ${{ secrets.VOLCENGINE_ACCESS_TOKEN }}
      VOLCENGINE_RESOURCE_ID: ${{ vars.VOLCENGINE_RESOURCE_ID }}
      VOLCENGINE_WS_ENDPOINT: ${{ vars.VOLCENGINE_WS_ENDPOINT }}
      VOLCENGINE_TEST_PCM_FILE: /tmp/volcengine-test.pcm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate ASR credentials
        run: |
          if [ -n "$VOLCENGINE_APP_ID" ] && [ -n "$VOLCENGINE_ACCESS_TOKEN" ]; then
            echo "Using documented legacy ASR AppID + AccessToken authentication"
          elif [ -n "$VOLCENGINE_API_KEY" ]; then
            echo "Using X-Api-Key authentication"
          else
            echo "::error title=Missing ASR credentials::Configure VOLCENGINE_API_KEY or both VOLCENGINE_APP_ID and VOLCENGINE_ACCESS_TOKEN."
            exit 1
          fi
          if [ -n "$VOLCENGINE_APP_ID" ] && [ -z "$VOLCENGINE_ACCESS_TOKEN" ]; then
            echo "::error title=Incomplete legacy credentials::VOLCENGINE_APP_ID is set but VOLCENGINE_ACCESS_TOKEN is missing."
            exit 1
          fi
          if [ -z "$VOLCENGINE_APP_ID" ] && [ -n "$VOLCENGINE_ACCESS_TOKEN" ]; then
            echo "::error title=Incomplete legacy credentials::VOLCENGINE_ACCESS_TOKEN is set but VOLCENGINE_APP_ID is missing."
            exit 1
          fi
      - name: Install speech fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate real spoken-audio PCM fixture
        run: |
          espeak-ng -v en -s 130 -w "${RUNNER_TEMP}/volcengine-test.wav" \
            "Hello. This is an integration test for Volcengine streaming speech recognition."
          ffmpeg -hide_banner -loglevel error -y \
            -i "${RUNNER_TEMP}/volcengine-test.wav" -ac 1 -ar 16000 \
            -c:a pcm_s16le -f s16le "$VOLCENGINE_TEST_PCM_FILE"
          test -s "$VOLCENGINE_TEST_PCM_FILE"
      - name: Test real optimized bidirectional ASR
        run: go test -tags=integration -run '^TestVolcengineLiveASR$' -count=1 -v -timeout 3m ./asr/providers/volcengine
