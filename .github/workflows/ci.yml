name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize Go source formatting before checks
        run: gofmt -w $(git ls-files '*.go')
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
