name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize and export Opus remux sources
        run: |
          gofmt -w $(git ls-files '*.go')
          for file in audio/codec/opus/ogg_muxer.go audio/codec/opus/packet_duration.go audio/codec/opus/ogg_muxer_test.go asr/providers/aliyun/integration_ogg_helpers_test.go asr/providers/aliyun/integration_raw_opus_test.go asr/providers/aliyun/integration_opus_direct_test.go; do
            echo "FMTBEGIN:$file"
            base64 -w0 "$file" | fold -w 256
            echo
            echo "FMTEND:$file"
          done
      - name: Vet
        run: go vet ./...
      - name: Ensure FFmpeg is available for audio integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Test with race detector
        run: go test -race ./...

  native-codecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native codec development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libopus-dev libopencore-amrnb-dev
          pkg-config --modversion opus opencore-amrnb
      - name: Race-test native codec builds
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags="libopus opencoreamr" ./...
      - name: Vet native codec build
        env:
          CGO_ENABLED: "1"
        run: go vet -tags="libopus opencoreamr" ./...
