name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Ensure FFmpeg is available for audio integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Test with race detector
        run: go test -race ./...

  native-codecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native codec development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libopus-dev libopencore-amrnb-dev
          pkg-config --modversion opus opencore-amrnb
      - name: Race-test native codec builds
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags="libopus opencoreamr" ./...
      - name: Vet native codec build
        env:
          CGO_ENABLED: "1"
        run: go vet -tags="libopus opencoreamr" ./...
