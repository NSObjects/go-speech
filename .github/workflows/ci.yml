name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize formatting for validation
        run: gofmt -w $(git ls-files '*.go')
      - name: Export formatted streaming source
        run: |
          for file in audio/ffmpeg/stream.go audio/ffmpeg/stream_test.go; do
            echo "FMTBEGIN:$file"
            base64 -w0 "$file" | fold -w 256
            echo
            echo "FMTEND:$file"
          done
      - name: Vet
        run: go vet ./...
      - name: Ensure FFmpeg is available for audio integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Test with race detector
        run: go test -race ./...
