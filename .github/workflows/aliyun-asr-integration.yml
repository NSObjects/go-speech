name: Aliyun ASR Integration (automatic, paid)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Every push runs paid integration once. PRs use the separate offline Go CI,
# avoiding duplicate cloud charges for the same branch and not exposing secrets
# to any pull_request event. Manual dispatch is optional for diagnostics.
jobs:
  live-asr:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nsobjects/go-speech-ci:sha-97c09deafd7c79bcf75e85e9bd3147d7f0299f87
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model:
          - fun-asr-realtime
          - qwen-audio-3.1-asr-flash-streaming
          - qwen-audio-3.1-asr-flash-message
          - paraformer-realtime-v2
          - paraformer-realtime-8k-v2
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_WS_ENDPOINT: ${{ vars.DASHSCOPE_WS_ENDPOINT }}
      DASHSCOPE_ASR_MODEL: ${{ matrix.model }}
      ASR_TEST_PCM_FILE: /tmp/speech-test.pcm
      ASR_TEST_OPUS_FILE: /tmp/speech-test.ogg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify API configuration
        run: |
          test -n "$DASHSCOPE_API_KEY" || { echo "Missing DASHSCOPE_API_KEY secret" >&2; exit 1; }
          test -n "$DASHSCOPE_WS_ENDPOINT" || { echo "Missing DASHSCOPE_WS_ENDPOINT variable" >&2; exit 1; }
          case "$DASHSCOPE_WS_ENDPOINT" in
            wss://*/api-ws/v1/inference) ;;
            *) echo "DASHSCOPE_WS_ENDPOINT must be a secure DashScope WebSocket endpoint" >&2; exit 1 ;;
          esac

      - name: Verify preinstalled audio fixture tools
        run: |
          command -v espeak-ng
          command -v ffmpeg
          command -v ffprobe

      - name: Generate synthetic speech fixtures
        run: |
          espeak-ng -v en -s 130 -w "${RUNNER_TEMP}/speech-test.wav" \
            "Hello. This is a real speech recognition integration test. Can you hear my voice clearly?"
          sample_rate=16000
          if [ "$DASHSCOPE_ASR_MODEL" = "paraformer-realtime-8k-v2" ]; then
            sample_rate=8000
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -i "${RUNNER_TEMP}/speech-test.wav" -ac 1 -ar "$sample_rate" \
            -c:a pcm_s16le -f s16le "$ASR_TEST_PCM_FILE"
          test -s "$ASR_TEST_PCM_FILE"

          # Ogg Opus is used to verify the decoder -> PCM -> ASR path.
          ffmpeg -hide_banner -loglevel error -y \
            -i "${RUNNER_TEMP}/speech-test.wav" -ac 1 -ar 48000 \
            -c:a libopus -b:a 32k -f ogg "$ASR_TEST_OPUS_FILE"
          test -s "$ASR_TEST_OPUS_FILE"

      - name: Live ASR task, audio, and final transcript
        run: go test -tags=integration -run '^TestAliyunLiveASR$' -count=1 -v -timeout 3m ./asr/providers/aliyun

      - name: Ogg Opus passthrough and raw Opus to Ogg remux (no transcoding)
        if: matrix.model == 'fun-asr-realtime'
        run: go test -tags=integration -run '^TestAliyunLiveOggPassthroughAndRemux$' -count=1 -v -timeout 4m ./asr/providers/aliyun

      - name: Ogg Opus decode to live ASR (Fun-ASR smoke test)
        if: matrix.model == 'fun-asr-realtime'
        run: go test -tags=integration -run '^TestAliyunLiveOpusPipeline$' -count=1 -v -timeout 3m ./asr/providers/aliyun

      - name: Verify preinstalled native libopus headers
        if: matrix.model == 'fun-asr-realtime'
        run: pkg-config --modversion opus

      - name: Raw Opus packet decode to live ASR (Fun-ASR smoke test)
        if: matrix.model == 'fun-asr-realtime'
        env:
          CGO_ENABLED: "1"
        run: go test -tags="integration libopus" -run '^TestAliyunLiveRawOpusPipeline$' -count=1 -v -timeout 3m ./asr/providers/aliyun
