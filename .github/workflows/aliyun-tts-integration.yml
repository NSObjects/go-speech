name: Aliyun CosyVoice TTS Integration (automatic, paid)

on:
  # Do not bill TTS while changing ASR-only provider code or test fixtures.
  # Keep TTS auto-checked whenever its code or shared dependencies change.
  push:
    paths:
      - "tts/**"
      - "audio/**"
      - "speecherr/**"
      - "transport/**"
      - "internal/connpool/**"
      - "speech.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/aliyun-tts-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_WS_ENDPOINT: ${{ vars.DASHSCOPE_WS_ENDPOINT }}
      DASHSCOPE_TTS_MODEL: ${{ vars.DASHSCOPE_TTS_MODEL }}
      DASHSCOPE_TTS_VOICE: ${{ vars.DASHSCOPE_TTS_VOICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify TTS credentials and regional endpoint
        run: |
          test -n "$DASHSCOPE_API_KEY" || { echo "Missing DASHSCOPE_API_KEY secret" >&2; exit 1; }
          test -n "$DASHSCOPE_WS_ENDPOINT" || { echo "Missing DASHSCOPE_WS_ENDPOINT variable" >&2; exit 1; }
          case "$DASHSCOPE_WS_ENDPOINT" in
            wss://*/api-ws/v1/inference) ;;
            *) echo "DASHSCOPE_WS_ENDPOINT must be a secure DashScope WebSocket endpoint" >&2; exit 1 ;;
          esac
      - name: Verify ffprobe for actual MP3/WAV audio analysis
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y ffmpeg || {
              sudo apt-get update -qq
              sudo apt-get install -y ffmpeg
            }
          fi
      - name: Real CosyVoice PCM MP3 WAV Ogg Opus streaming and batch checks
        run: go test -tags=integration -run '^TestAliyunLive(CosyVoice(EncodedFormats|Opus)?|Duplex|Advanced|Pool)$' -count=1 -v -timeout 6m ./tts/providers/aliyun
